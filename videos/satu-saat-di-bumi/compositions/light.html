  <script>
    // a spiral that circles the Earth 7.5 times, widening as it goes
    const turns = 7.5;
    const steps = Math.round(turns * 90);
    let d = "";
    for (let i = 0; i <= steps; i++) {
      const f = i / steps;
      const a = -Math.PI / 2 + f * turns * 2 * Math.PI;
      const r = 225 + f * 75;
      d += (i ? "L" : "M") + (1440 + Math.cos(a) * r).toFixed(1) + "," + (560 + Math.sin(a) * r).toFixed(1);
    }
    const path = document.getElementById("light-path");
    path.setAttribute("d", d);
    const len = path.getTotalLength();
    path.setAttribute("stroke-dasharray", len.toFixed(1));
    path.setAttribute("stroke-dashoffset", len.toFixed(1));

    const tl = gsap.timeline({ paused: true });
    const numEl = document.getElementById("light-count");
    const n = { v: 0 };
    tl.fromTo(
      "#light-label",
      { clipPath: "inset(0 100% 0 0)" },
      { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power3.out" },
      0.25,
    );
    // one real second: the light laps the Earth 7.5 times while the count runs to 300,000
    tl.fromTo(path, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 1, ease: "none" }, 0.6);
    tl.fromTo(
      n,
      { v: 0 },
      {
        v: 300000,
        duration: 1,
        ease: "none",
        onUpdate: () => {
          numEl.textContent = (Math.round(n.v / 1000) * 1000).toLocaleString("en-US");
        },
      },
      0.6,
    );
    tl.fromTo("#light-laps", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 1.9);
    tl.fromTo("#light-src", { opacity: 0 }, { opacity: 0.75, duration: 0.3, ease: "none" }, 2.3);
    window.__timelines["light"] = tl;
  </script>
